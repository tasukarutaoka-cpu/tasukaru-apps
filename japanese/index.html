<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เรียนภาษาญี่ปุ่นกับโมโมะ | แอปของเจน</title>
<meta name="description" content="แอปเรียนสนทนาภาษาญี่ปุ่นสุดน่ารักสำหรับเจน เรียนเพลิน ๆ ทุกวันกับโมโมะ">
<style>
  :root{
    --bg:#fff5f8; --surface:#ffffff; --surface2:#ffedf3;
    --ink:#503040; --muted:#bb8fa1; --line:#ffd9e6;
    --accent:#ef6a9e; --accent-deep:#d94f83; --accent-soft:#ffe3ee;
    --good:#3faf7d; --good-soft:#e2f7ec; --bad:#e5637c; --bad-soft:#ffe9ee;
    --radius:20px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#2a1b22; --surface:#3a2530; --surface2:#452c3a; --ink:#ffeef4; --muted:#d3a7ba; --line:#5f3d4e; --accent:#ff9ec2; --accent-deep:#ff8ab5; --accent-soft:#55303f; --good:#7ed7a8; --good-soft:#274a3a; --bad:#ffa4b5; --bad-soft:#54303c; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans Thai","Noto Sans JP",system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  .wrap{ max-width:640px; margin:0 auto; padding:14px 14px 96px; }
  header.app h1{ font-size:21px; margin:4px 0 2px; }
  header.app .sub{ margin:0; color:var(--muted); font-size:13px; }
  .hero{ display:flex; gap:12px; align-items:center; background:var(--surface); border:2px solid var(--line); border-radius:24px; padding:12px 14px; margin:12px 0; }
  .hero img{ width:92px; height:92px; border-radius:50%; object-fit:cover; border:3px solid var(--accent-soft); flex:none; }
  .bubble{ position:relative; background:var(--accent-soft); border-radius:16px; padding:10px 12px; font-size:14px; flex:1; }
  .bubble:before{ content:""; position:absolute; left:-7px; top:50%; margin-top:-7px; border:7px solid transparent; border-right-color:var(--accent-soft); border-left:0; }
  .bubble .b-ja{ font-weight:800; font-size:16px; color:var(--accent-deep); }
  .stats{ display:flex; gap:8px; margin:10px 0 2px; flex-wrap:wrap; }
  .stat{ background:var(--surface); border:1.5px solid var(--line); border-radius:99px; padding:5px 12px; font-size:13px; font-weight:700; }
  .bar{ height:9px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-top:8px; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--accent),#ffb3cd); border-radius:99px; transition:width .4s; }
  nav.tabs{ position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:2px solid var(--line); display:flex; z-index:20; padding-bottom:env(safe-area-inset-bottom); }
  nav.tabs button{ flex:1; border:0; background:none; padding:9px 2px 7px; font-size:12px; color:var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-family:inherit; }
  nav.tabs button .ic{ font-size:19px; }
  nav.tabs button.on{ color:var(--accent-deep); font-weight:800; }
  .card{ background:var(--surface); border:2px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0; }
  .card h3{ margin:0 0 8px; font-size:16px; }
  .ja{ font-size:24px; font-weight:800; letter-spacing:.01em; }
  .ja.sm{ font-size:19px; }
  .romaji{ color:var(--accent-deep); font-size:14px; font-weight:700; }
  .th{ font-size:15px; margin-top:2px; }
  .note{ color:var(--muted); font-size:13px; margin-top:6px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button.btn{ border:2px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:8px 15px; font-size:14px; cursor:pointer; font-family:inherit; font-weight:600; }
  button.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:800; }
  button.btn.good{ background:var(--good); border-color:var(--good); color:#fff; font-weight:800; }
  button.btn:disabled{ opacity:.45; }
  button.btn.playing{ background:var(--accent-soft); }
  .dots{ display:flex; gap:5px; margin:10px 0; flex-wrap:wrap; }
  .dots i{ width:9px; height:9px; border-radius:50%; background:var(--line); }
  .dots i.done{ background:var(--good); }
  .dots i.now{ background:var(--accent); }
  .scene-head{ display:flex; justify-content:space-between; align-items:baseline; margin:18px 0 4px; }
  .scene-head h3{ margin:0; font-size:16px; }
  .scene-head span{ font-size:12px; color:var(--muted); }
  .stamps{ display:flex; gap:6px; flex-wrap:wrap; }
  .stamp{ width:44px; height:44px; border-radius:50%; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:20px; background:var(--surface); filter:grayscale(1); opacity:.45; }
  .stamp.got{ border-style:solid; border-color:var(--accent); filter:none; opacity:1; background:var(--accent-soft); }
  .choices{ display:grid; gap:8px; margin-top:10px; }
  .choices button{ text-align:left; padding:12px 14px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:15px; cursor:pointer; color:var(--ink); font-family:inherit; }
  .choices button.right{ background:var(--good-soft); border-color:var(--good); }
  .choices button.wrong{ background:var(--bad-soft); border-color:var(--bad); }
  .bubble-chat{ max-width:88%; padding:10px 13px; border-radius:18px; margin:8px 0; font-size:15px; }
  .bubble-chat.p{ background:var(--surface2); margin-right:auto; border-bottom-left-radius:4px; }
  .bubble-chat.u{ background:var(--accent-soft); margin-left:auto; border-bottom-right-radius:4px; }
  .bubble-chat .who{ font-size:11px; color:var(--muted); margin-bottom:2px; }
  .bubble-chat .sub{ font-size:13px; color:var(--muted); }
  .verdict{ font-weight:800; margin-top:8px; }
  .verdict.ok{ color:var(--good); } .verdict.ng{ color:var(--bad); }
  details.card summary{ cursor:pointer; font-weight:800; font-size:15px; }
  .ex{ padding:8px 0; border-top:1.5px dashed var(--line); }
  .ex:first-of-type{ border-top:0; }
  .cheer{ position:fixed; left:50%; top:14px; transform:translateX(-50%) translateY(-16px); background:var(--surface); border:2px solid var(--accent); border-radius:18px; padding:8px 12px; display:flex; gap:10px; align-items:center; box-shadow:0 8px 24px rgba(217,79,131,.25); opacity:0; pointer-events:none; transition:.3s; z-index:40; max-width:92vw; }
  .cheer.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .cheer img{ width:46px; height:46px; border-radius:50%; object-fit:cover; }
  .cheer .c-ja{ font-weight:800; color:var(--accent-deep); font-size:15px; }
  .cheer .c-th{ font-size:13px; }
  .heart{ position:fixed; font-size:20px; pointer-events:none; z-index:39; animation:floatUp 1.4s ease-out forwards; }
  @keyframes floatUp{ 0%{ transform:translateY(0) scale(.7); opacity:0; } 15%{ opacity:1; } 100%{ transform:translateY(-120px) scale(1.15); opacity:0; } }
  .toast{ position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:30; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .hidden{ display:none !important; }
  .mic-live{ background:var(--bad) !important; border-color:var(--bad) !important; color:#fff !important; }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>🎀 เรียนภาษาญี่ปุ่นกับโมโมะ</h1>
    <p class="sub">แอปพิเศษสำหรับเจนคนเดียว — เรียนสนุก ๆ วันละนิด ไม่เบื่อแน่นอน</p>
  </header>

  <div class="hero">
    <img src="mascot.png" alt="โมโมะ">
    <div class="bubble">
      <div class="b-ja" id="heroJa">เจนจัง、こんにちは！</div>
      <div id="heroTh">สวัสดีเจน! วันนี้มาเรียนภาษาญี่ปุ่นกันเถอะ โมโมะอยู่ข้าง ๆ เสมอ</div>
    </div>
  </div>
  <div class="stats">
    <span class="stat" id="statStars">⭐ 0</span>
    <span class="stat" id="statStreak">🔥 0 วันติดกัน</span>
    <span class="stat" id="statLevel">🥚 เริ่มต้น</span>
    <span class="stat" id="statLearned">📚 0/64 วลี</span>
  </div>
  <div class="bar"><i id="progBar" style="width:0%"></i></div>

  <main>
    <section id="view-today"></section>
    <section id="view-scenes" class="hidden"></section>
    <section id="view-quiz" class="hidden"></section>
    <section id="view-talk" class="hidden"></section>
    <section id="view-grammar" class="hidden"></section>
  </main>
</div>

<nav class="tabs" role="tablist" aria-label="เมนูฝึก">
  <button type="button" data-view="today" class="on"><span class="ic">📅</span>วันนี้</button>
  <button type="button" data-view="scenes"><span class="ic">🗂️</span>ฉาก</button>
  <button type="button" data-view="quiz"><span class="ic">👂</span>เกมฟัง</button>
  <button type="button" data-view="talk"><span class="ic">💬</span>สนทนา</button>
  <button type="button" data-view="grammar"><span class="ic">🧩</span>ไวยากรณ์</button>
</nav>

<div class="cheer" id="cheer">
  <img src="mascot.png" alt="">
  <div><div class="c-ja" id="cheerJa"></div><div class="c-th" id="cheerTh"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ===== Data ===== */
var SCENES = [
  { name: "ทักทาย・แนะนำตัว", icon: "👋", stamp: "🌸" },
  { name: "คุยเล่น・ถามสารทุกข์สุกดิบ", icon: "☕", stamp: "🍵" },

  { name: "ชวนเที่ยว・นัดเจอ", icon: "🎡", stamp: "🎠" },

var PHRASES = [
  /* 0 greetings */
  { ja: "こんにちは", romaji: "konnichiwa", th: "สวัสดีตอนกลางวัน", note: "ใช้ทักทายตอนกลางวัน" },
  { ja: "はじめまして", romaji: "hajimemashite", th: "ยินดีที่ได้รู้จัก", note: "พูดครั้งแรกที่เจอกัน" },
  { ja: "ジェンといいます", romaji: "Jen to iimasu", th: "ฉันชื่อเจนค่ะ", note: "แนะนำชื่อตัวเอง แบบสุภาพนิดหน่อย" },

  { ja: "お元気ですか", romaji: "o-genki desu ka", th: "สบายดีไหมคะ", note: "ถามสารทุกข์สุกดิบ" },

  /* 1 small talk */

  /* 2 eating */
  { ja: "いただきます", romaji: "itadakimasu", th: "จะทานแล้วนะคะ (พูดก่อนกินข้าว)", note: "พูดก่อนเริ่มกินเสมอ" },
  { ja: "おいしいです", romaji: "oishii desu", th: "อร่อยมากค่ะ", note: "ชมอาหาร" },
  { ja: "辛いのが好きです", romaji: "karai no ga suki desu", th: "ชอบกินเผ็ดค่ะ", note: "บอกรสชาติที่ชอบ" },

      var pt = PATTERNS[parseInt(b.getAttribute("data-reveal"), 10)];
      var out = document.getElementById("drill-" + b.getAttribute("data-reveal"));
      out.innerHTML = '<div class="ja sm" style="margin-top:8px">' + pt.drill.ja + '</div><div class="romaji">' + pt.drill.romaji + '</div>' + playBtns(pt.drill);
    });
  });
}
/* ===== Init ===== */
(function init() {
  var h = HERO_LINES[Math.floor(Math.random() * HERO_LINES.length)];
  document.getElementById("heroJa").textContent = h.ja;
  document.getElementById("heroTh").textContent = h.th;
  updateStats();
  renderToday();
})();
</script>
