<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>タイ語かいわ練習 ブラウザ版</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f6f2e9;
        --surface: #fffdf7;
        --surface2: #efe9da;
        --ink: #24312a;
        --muted: #61705f;
        --line: #ddd3ba;
        --accent: #14594a;
        --accent-ink: #ffffff;
        --amber: #c77400;
        --amber-bg: #fdf0dc;
        --good: #177245;
        --good-bg: #e2f2e6;
        --bad: #b3401e;
        --bad-bg: #fbe9e1;
        --shadow: 0 2px 10px rgba(60, 50, 20, .08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111614;
          --surface: #1b221e;
          --surface2: #232b26;
          --ink: #e9ede6;
          --muted: #9dab9e;
          --line: #39443b;
          --accent: #45b08d;
          --accent-ink: #0d1f18;
          --amber: #eda63f;
          --amber-bg: #3a2d15;
          --good: #5cc78c;
          --good-bg: #173526;
          --bad: #ef8a68;
          --bad-bg: #3d2118;
          --shadow: 0 2px 10px rgba(0,0,0,.35);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
        font-size: 17px;
        line-height: 1.65;
      }
      .thai { font-family: "Noto Sans Thai", "Hiragino Sans", sans-serif; }
      .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 64px; }

      header.top { padding: 26px 0 6px; }
      header.top h1 {
        font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
        font-weight: 800;
        font-size: 30px;
        margin: 0 0 4px;
        letter-spacing: .02em;
      }
      header.top p.sub { margin: 0 0 18px; color: var(--muted); font-size: 15px; }

      .progress-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .progress-card .big { font-size: 26px; font-weight: 800; font-family: "Shippori Mincho B1", serif; }
      .progress-card .lbl { font-size: 13px; color: var(--muted); }
      .bar { flex: 1; }
      .bar .track { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; }
      .bar .fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
      .bar .cap { font-size: 13px; color: var(--muted); margin-top: 4px; }

      nav.tabs {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg);
        padding: 14px 0 10px;
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
      }
      nav.tabs button {
        appearance: none; border: 1px solid var(--line); background: var(--surface);
        color: var(--ink); border-radius: 999px; padding: 11px 4px;
        font-size: 14.5px; font-weight: 700; cursor: pointer; min-height: 48px;
      }
      nav.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

      section.view { display: none; }
      section.view.active { display: block; }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 20px 18px;
        margin-bottom: 14px;
      }
      .scene-name { font-size: 13px; font-weight: 700; color: var(--amber); letter-spacing: .08em; }
      .kana { font-size: 27px; font-weight: 800; line-height: 1.45; margin: 6px 0 2px; }
      .thai-text { font-size: 21px; color: var(--ink); margin: 2px 0; }
      .meaning { font-size: 17px; color: var(--muted); margin: 2px 0 0; }
      .note { font-size: 14px; color: var(--muted); background: var(--surface2); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
      .parts { font-size: 13.5px; color: var(--muted); margin-top: 8px; line-height: 2; }
      .parts .pw { font-weight: 700; color: var(--accent); }
      .form-line { font-size: 13.5px; margin-top: 8px; padding: 7px 10px; background: var(--surface2); border-left: 4px solid var(--accent); border-radius: 0 8px 8px 0; }
      .polite { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 6px; }
      .polite summary { font-size: 13.5px; color: var(--muted); cursor: pointer; padding: 4px 0; }
      .polite .kana { font-size: 20px; }
      .polite-line { font-size: 14px; color: var(--muted); margin-top: 8px; }
      .polite-line .btn { margin-left: 8px; padding: 4px 12px; font-size: 13px; }
      .tone-box { margin: 12px 0 4px; }
      .tone-box .cap { font-size: 12.5px; color: var(--muted); margin-bottom: 2px; }
      .tone-box svg { width: 100%; height: 56px; display: block; }

      .play-row { display: flex; gap: 10px; margin-top: 14px; }
      .btn {
        appearance: none; cursor: pointer; border-radius: 999px; border: 1px solid var(--line);
        background: var(--surface2); color: var(--ink);
        font-size: 16.5px; font-weight: 700; padding: 12px 18px; min-height: 54px;
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; }
      .btn.slow { flex: 1; }
      .btn:active { transform: scale(.98); }
      .btn.playing { outline: 3px solid var(--amber); outline-offset: 1px; }
      .btn svg { flex: none; }

      .judge-row { display: flex; gap: 10px; margin-top: 12px; }
      .btn.good { flex: 1; background: var(--good-bg); border-color: var(--good); color: var(--good); font-size: 18px; min-height: 60px; }
      .btn.again { flex: 1; background: var(--bad-bg); border-color: var(--bad); color: var(--bad); font-size: 18px; min-height: 60px; }

      .dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
      .dots span { width: 11px; height: 11px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); }
      .dots span.done { background: var(--good); border-color: var(--good); }
      .dots span.now { background: var(--amber); border-color: var(--amber); }
      .session-cap { font-size: 14px; color: var(--muted); margin-bottom: 8px; }

      .done-box { text-align: center; padding: 28px 18px; }
      .done-box .face { font-family: "Shippori Mincho B1", serif; font-size: 24px; font-weight: 800; margin-bottom: 6px; }
      .done-box p { color: var(--muted); margin: 4px 0 16px; }

      h2.scene-title {
        font-family: "Shippori Mincho B1", serif; font-size: 21px; font-weight: 800;
        margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px;
      }
      h2.scene-title .cnt { font-family: inherit; font-size: 13px; color: var(--muted); font-weight: 400; }
      .phrase-row {
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow);
      }
      .phrase-row .kana { font-size: 20px; margin: 0; }
      .phrase-row .thai-text { font-size: 17px; }
      .phrase-row .meaning { font-size: 15px; }
      .phrase-row .play-row { margin-top: 10px; }
      .phrase-row .btn { min-height: 48px; font-size: 15px; padding: 9px 14px; }
      .badge {
        display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px;
        padding: 2px 9px; background: var(--good-bg); color: var(--good); margin-left: 8px; vertical-align: middle;
      }
      .badge.new { background: var(--amber-bg); color: var(--amber); }
      .badge.todo { background: var(--surface2); color: var(--muted); }

      .quiz-q { text-align: center; padding: 26px 18px 20px; }
      .quiz-q .q-cap { color: var(--muted); font-size: 15px; margin-bottom: 14px; }
      .quiz-play { width: 92px; height: 92px; border-radius: 50%; font-size: 16px; flex-direction: column; gap: 2px; }
      .choices { display: grid; gap: 10px; }
      .choices button {
        text-align: left; font-size: 17.5px; min-height: 58px; border-radius: 12px;
        background: var(--surface); border: 1.5px solid var(--line); padding: 12px 16px; cursor: pointer; color: var(--ink);
      }
      .choices button.right { border-color: var(--good); background: var(--good-bg); font-weight: 700; }
      .choices button.wrong { border-color: var(--bad); background: var(--bad-bg); }
      .choices button:disabled { opacity: .85; cursor: default; }
      .quiz-feedback { min-height: 30px; font-weight: 700; margin: 12px 0 4px; text-align: center; }
      .quiz-score { text-align: center; color: var(--muted); font-size: 14.5px; }

      .tone-card .tone-head { display: flex; align-items: baseline; gap: 10px; }
      .tone-card .tone-name { font-family: "Shippori Mincho B1", serif; font-size: 21px; font-weight: 800; }
      .tone-card .tone-desc { color: var(--muted); font-size: 15px; }
      .tone-card .example { display: flex; align-items: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
      .tone-card .example .thai-text { font-size: 26px; }
      .tone-card .example .kana { font-size: 19px; margin: 0; }
      .tone-card > svg { width: 100%; height: 64px; display: block; margin-top: 8px; }

      footer { margin-top: 36px; color: var(--muted); font-size: 13.5px; }
      footer .reset {
        background: none; border: 1px solid var(--line); color: var(--muted);
        border-radius: 999px; padding: 8px 14px; font-size: 13.5px; cursor: pointer; margin-top: 8px;
      }
      .toast {
        position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 999px;
        font-size: 15px; font-weight: 700; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
        max-width: 88vw; text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
      /* かいわモード */
      .dlg-btn { display:block; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:14px; margin:10px 0; font-size:15px; color:var(--ink); box-shadow:var(--shadow); }
      .dlg-btn .dlg-t { font-weight:800; font-size:16px; }
      .dlg-btn .dlg-s { font-size:12px; color:var(--muted); margin-top:2px; }
      .bubble { max-width:90%; padding:10px 12px; border-radius:14px; margin:8px 0; font-size:15px; line-height:1.55; }
      .bubble.p { background:var(--surface); border:1.5px solid var(--line); margin-right:auto; border-bottom-left-radius:4px; }
      .bubble.u { background:var(--accent); color:var(--accent-ink); margin-left:auto; border-bottom-right-radius:4px; }
      .bubble .b-ja { font-size:12px; opacity:.8; }
      .bubble .b-kana { font-size:13px; opacity:.9; }
      .bubble button { margin-top:6px; }
      .turn-card { background:var(--surface); border:2px solid var(--accent); border-radius:14px; padding:14px; margin:12px 0; }
      .turn-card .t-ja { font-size:19px; font-weight:800; }
      .turn-card .t-kana { font-size:15px; color:var(--accent); font-weight:700; margin-top:2px; }
      .mic-btn { display:block; width:100%; background:#e0632f; color:#fff; border:none; border-radius:999px; padding:15px; font-size:17px; font-weight:800; margin:12px 0 6px; }
      .mic-btn.listening { background:var(--bad); animation:micpulse 1s infinite; }
      @keyframes micpulse { 50% { opacity:.55; } }
      .heard-box { background:var(--surface2); border-radius:10px; padding:9px 11px; font-size:14px; margin:8px 0; word-break:break-all; }
      .judge-ok { color:var(--good); font-weight:800; font-size:16px; }
      .judge-ng { color:var(--bad); font-weight:800; font-size:16px; }
      .row-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
      .row-btns button { flex:1; min-width:120px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <h1>タイ語かいわ練習</h1>
        <p class="sub">聞いて、声に出すだけ。読み書きなしで、タイ人との日常会話を目指します。</p>
        <div class="progress-card">
          <div>
            <div class="big"><span id="learnedCount">0</span><span style="font-size:16px;"> / 64</span></div>
            <div class="lbl">言えるようになったフレーズ</div>
          </div>
          <div class="bar">
            <div class="track"><div class="fill" id="progressFill" style="width:0%"></div></div>
            <div class="cap" id="progressCap">今日の練習が待っています</div>
          </div>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="練習メニュー">
        <button role="tab" data-view="today" aria-selected="true">今日の練習</button>
        <button role="tab" data-view="scenes" aria-selected="false">場面から探す</button>
        <button role="tab" data-view="quiz" aria-selected="false">聞き取り</button>
        <button role="tab" data-view="talk" aria-selected="false">かいわ</button>
        <button role="tab" data-view="free" aria-selected="false">フリー会話</button>
        <button role="tab" data-view="listen" aria-selected="false">聞き流し</button>
        <button role="tab" data-view="grammar" aria-selected="false">ぶんぽう</button>
        <button role="tab" data-view="tones" aria-selected="false">声調ガイド</button>
      </nav>

      <main>
        <section class="view active" id="view-today"></section>
        <section class="view" id="view-scenes"></section>
        <section class="view" id="view-quiz"></section>
        <section class="view" id="view-talk"></section>
        <section class="view" id="view-free"></section>
        <section class="view" id="view-listen"></section>
        <section class="view" id="view-grammar"></section>
        <section class="view" id="view-tones"></section>
      </main>

      <footer>
        <p>学習の記録は、この端末のブラウザの中にだけ保存されます。別のスマホやパソコンでは記録は引き継がれません。</p>
        <button class="reset" id="resetBtn" type="button">記録をすべて消す</button>
      </footer>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <audio id="player" preload="none"></audio>

    <script>

      /* ============ データ: 8場面 × 8フレーズ ============ */
      var SCENES = ["あいさつ", "自己紹介", "買い物", "食事", "移動", "ホテル", "困ったとき", "気持ちを伝える"];

      var PHRASES = [

        { id:"s1p1", sTh:"สวัสดี", sKana:"サワッディー", sTone:[2, 2], sParts:[["サワッディー", "こんにちは"]], th:"สวัสดีครับ", kana:"サワッディー・クラップ", ja:"こんにちは", tone:[2,2,3,4], note:"朝・昼・夜いつでも使える基本のあいさつ。手を合わせる「ワイ」と一緒にどうぞ。", parts:[["サワッディー","こんにちは"],["クラップ","丁寧な語尾"]], form:"あいさつ ＋ 丁寧語尾" },
        { id:"s1p2", sTh:"สวัสดีตอนเช้า", sKana:"サワッディー・トーン・チャーオ", sTone:[2, 2, 3, 4, 5], sParts:[["サワッディー", "こんにちは"], ["トーン", "〜の時"], ["チャーオ", "朝"]], th:"สวัสดีตอนเช้าครับ", kana:"サワッディー・トーン・チャーオ・クラップ", ja:"おはようございます", tone:[2,2,3,4,5,4], note:"朝のあいさつ。「トーン・チャーオ」が「朝に」という意味です。", parts:[["サワッディー","こんにちは"],["トーン","〜の時"],["チャーオ","朝"],["クラップ","丁寧な語尾"]], form:"あいさつ ＋ 時【朝】＋ 丁寧語尾" },
        { id:"s1p3", sTh:"ขอบคุณ", sKana:"コープクン", sTone:[2, 4], sParts:[["コープクン", "ありがとう"]], th:"ขอบคุณครับ", kana:"コープクン・クラップ", ja:"ありがとうございます", tone:[2,4,4], note:"感謝の基本。「コープ」は低めから、「クン」は高めに。", parts:[["コープクン","ありがとう"],["クラップ","丁寧な語尾"]], form:"感謝 ＋ 丁寧語尾" },
        { id:"s1p4", sTh:"ขอบคุณมาก", sKana:"コープクン・マーク", sTone:[2, 4, 5], sParts:[["コープクン", "ありがとう"], ["マーク", "とても"]], th:"ขอบคุณมากครับ", kana:"コープクン・マーク・クラップ", ja:"本当にありがとうございます", tone:[2,4,5,4], note:"「マーク（とても）」を足すと気持ちが強まります。", parts:[["コープクン","ありがとう"],["マーク","とても"],["クラップ","丁寧な語尾"]], form:"感謝 ＋ 強調（とても）＋ 丁寧語尾" },
        { id:"s1p5", sTh:"ขอโทษ", sKana:"コー・トーッ", sTone:[3, 5], sParts:[["コー", "許しを請う"], ["トーッ", "過ち"]], th:"ขอโทษครับ", kana:"コー・トーッ・クラップ", ja:"すみません／ごめんなさい", tone:[3,5,4], note:"謝るときも、人に声をかけるときも使えます。", parts:[["コー","許しを請う"],["トーッ","過ち"],["クラップ","丁寧な語尾"]], form:"謝罪 ＋ 丁寧語尾" },

        { id:"s8p7", sTh:"ถ่ายรูปด้วยกันไหม", sKana:"ターイ・ループ・ドゥアイ・ガン・マイ", sTone:[2, 5, 5, 3, 3, 4], sParts:[["ターイ", "撮る"], ["ループ", "写真"], ["ドゥアイガン", "一緒に"], ["マイ", "〜か？"]], th:"ถ่ายรูปด้วยกันไหมครับ", kana:"ターイ・ループ・ドゥアイ・ガン・マイ・クラップ", ja:"一緒に写真を撮りませんか？", tone:[2,5,5,3,3,4,4], note:"仲良くなった人との記念に。相手の了承を取ってからどうぞ。", parts:[["ターイ","撮る"],["ループ","写真"],["ドゥアイガン","一緒に"],["マイ","〜か？"],["クラップ","丁寧な語尾"]], form:"動詞（撮る）＋ 目的語（写真）＋ 一緒に ＋ 疑問 ＋ 丁寧語尾" },
        { id:"s8p8", sTh:"รักษาสุขภาพนะ", sKana:"ラック・サー・スッカパープ・ナ", sTone:[4, 3, 5, 2, 5, 3], sParts:[["ラックサー", "大切にする"], ["スッカパープ", "健康"], ["ナ", "〜ね"]], th:"รักษาสุขภาพด้วยนะครับ", kana:"ラック・サー・スッカパープ・ドゥアイ・ナ・クラップ", ja:"お体に気をつけてください", tone:[4,3,5,2,5,5,3,4], note:"別れ際の気づかいの一言。年上の方へのあいさつにも。", parts:[["ラックサー","大切にする"],["スッカパープ","健康"],["ドゥアイ","〜も"],["ナ","〜ね"],["クラップ","丁寧な語尾"]], form:"動詞（大切にする）＋ 目的語（健康）＋ 〜も ＋ 〜ね ＋ 丁寧語尾" }
      ];
      var BY_ID = {};
      PHRASES.forEach(function (p, i) { p.scene = Math.floor(i / 8); BY_ID[p.id] = p; });

      var TONES = [
        { id:"tone1", name:"中声（ちゅうせい）", desc:"まっすぐ平らに。日本語の普通の声の高さでそのまま。", word:"มา", kana:"マー", ja:"来る", tone:[3,3,3] },
        { id:"tone2", name:"低声（ていせい）", desc:"低いところで平らに。力を抜いて低めに保ちます。", word:"ใหม่", kana:"マイ", ja:"新しい", tone:[1,1,1] },
        { id:"tone3", name:"下声（かせい）", desc:"高いところからすとんと落とす。「あっ！」と驚くときの落ち方。", word:"ไม่", kana:"マイ", ja:"〜ない（否定）", tone:[5,3,1] },
        { id:"tone4", name:"高声（こうせい）", desc:"高いところで平らに。少し張った声で高めを保ちます。", word:"น้ำ", kana:"ナーム", ja:"水", tone:[5,5,5] },
        { id:"tone5", name:"上声（じょうせい）", desc:"低いところからぐいっと上げる。日本語の「え？」と聞き返す上げ方。", word:"หมา", kana:"マー", ja:"犬", tone:[1,3,5] }
      ];

      /* ============ 記録（このブラウザ内だけに保存） ============ */
      var STORE_KEY = "thaiKaiwaBrowser.v1";
      var INTERVALS = [0, 1, 2, 4, 7, 14, 30]; /* 習得段階ごとの次回復習までの日数 */
      var store = { prog: {}, lastDay: "" };
      try {
        var raw = localStorage.getItem(STORE_KEY);
        if (raw) { var parsed = JSON.parse(raw); if (parsed && parsed.prog) store = parsed; }
      } catch (e) { /* 保存できない環境ではメモリ内だけで動く */ }
      function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
      }
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      function addDays(str, n) {
        var d = new Date(str + "T00:00:00"); d.setDate(d.getDate() + n);
        return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      }
      function learnedCount() {
        var n = 0;
        PHRASES.forEach(function (p) { var r = store.prog[p.id]; if (r && r.box >= 2) n++; });
        return n;
      }

      /* ============ 音声再生（1つだけ） ============ */
      var player = document.getElementById("player");
      var currentBtn = null;
      function stopAudio() {
        player.pause();
        if (currentBtn) { currentBtn.classList.remove("playing"); currentBtn = null; }
      }
      function playAudio(src, btn) {
        if (currentBtn === btn && !player.paused) { stopAudio(); return; }
        stopAudio();
        player.src = src;
        currentBtn = btn || null;
        if (btn) btn.classList.add("playing");
        var pr = player.play();
        if (pr && pr.catch) pr.catch(function () { if (btn) btn.classList.remove("playing"); });
      }
      player.addEventListener("ended", function () { if (currentBtn) currentBtn.classList.remove("playing"); currentBtn = null; });

      function toast(msg) {
        var t = document.getElementById("toast");
        t.textContent = msg; t.classList.add("show");
        setTimeout(function () { t.classList.remove("show"); }, 2200);
      }

      /* ============ 声調ライン（SVG） ============ */
      function toneSVG(points, h) {
        var w = 300, hh = h || 56, pad = 8;
        var min = 1, max = 5;
        var stepX = (w - pad * 2) / Math.max(points.length - 1, 1);
        var pts = points.map(function (v, i) {
          var x = pad + stepX * i;
          var y = pad + (max - v) / (max - min) * (hh - pad * 2);
          return x.toFixed(1) + "," + y.toFixed(1);
        }).join(" ");
        return '<svg viewBox="0 0 ' + w + ' ' + hh + '" preserveAspectRatio="none" aria-hidden="true">' +
          '<line x1="0" y1="' + (hh - 6) + '" x2="' + w + '" y2="' + (hh - 6) + '" stroke="var(--line)" stroke-width="1"/>' +
          '<polyline points="' + pts + '" fill="none" stroke="var(--amber)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      }

      var ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
      function playButtons(p, big) {
        return '<div class="play-row">' +
          '<button type="button" class="btn primary" data-play="' + p.id + '">' + ICON_PLAY + '音声を聞く</button>' +
          '<button type="button" class="btn slow" data-play="' + p.id + '-slow">' + ICON_PLAY + 'ゆっくり</button>' +
          '</div>';
      }
      function playButtonsS(p, big) {
        return '<div class="play-row">' +
          '<button type="button" class="btn primary" data-play="' + p.id + '-s">' + ICON_PLAY + '音声を聞く</button>' +
          '<button type="button" class="btn slow" data-play="' + p.id + '-s-slow">' + ICON_PLAY + 'ゆっくり</button>' +
          '</div>';
      }
      function sPartsHTML(p) {
        if (!p.sParts) return "";
        return '<div class="parts">' + p.sParts.map(function (w) { return '<span class="pw">' + w[0] + '</span>（' + w[1] + '）'; }).join('・') + '</div>';
      }
      function politeHTML(p) {
        return '<details class="polite"><summary>丁寧な言い方（お店の人・目上の人向け）</summary>' +
          '<div class="kana">' + p.kana + '</div>' +
          '<div class="thai-text thai">' + p.th + '</div>' +
          partsHTML(p) + formHTML(p) +
          '<div class="play-row"><button type="button" class="btn slow" data-play="' + p.id + '">' + ICON_PLAY + '丁寧な音声</button>' +
          '<button type="button" class="btn slow" data-play="' + p.id + '-slow">' + ICON_PLAY + 'ゆっくり</button></div></details>';
      }
      function politeLineHTML(p) {
        return '<div class="polite-line">丁寧：' + p.kana + '<button type="button" class="btn slow" data-play="' + p.id + '">聞く</button></div>';
      }
      function statusChip(p) {
        var r = store.prog[p.id];
        if (!r) return '<span class="badge todo">⬜ まだ</span>';
        if (r.box >= 2) return '<span class="badge">✅ 言える</span>';
        var t = todayStr();
        var when = r.due <= t ? "今日" : r.due === addDays(t, 1) ? "明日" : r.due.slice(5).replace("-", "/");
        return '<span class="badge new">📖 練習中（次の復習：' + when + '）</span>';
      }
      function partsHTML(p) {
        if (!p.parts) return "";
        return '<div class="parts">' + p.parts.map(function (w) { return '<span class="pw">' + w[0] + '</span>（' + w[1] + '）'; }).join('・') + '</div>';
      }
      function formHTML(p) {
        if (!p.form) return "";
        return '<div class="form-line">🧩 型：' + p.form + '</div>';
      }
      function phraseCardHTML(p, badgeText) {
        return '<div class="scene-name">' + SCENES[p.scene] + (badgeText ? '<span class="badge' + (badgeText === "新規" ? " new" : "") + '">' + badgeText + '</span>' : "") + '</div>' +
          '<div class="kana">' + (p.sKana || p.kana) + '</div>' +
          '<div class="thai-text thai">' + (p.sTh || p.th) + '</div>' +
          '<p class="meaning">' + p.ja + '</p>' +
          sPartsHTML(p) +
          '<div class="tone-box"><div class="cap">音の高さの目安（声調）</div>' + toneSVG(p.sTone || p.tone) + '</div>' +
          playButtonsS(p) +
          politeHTML(p) +
          (p.note ? '<div class="note">' + p.note + '</div>' : "");
      }

      document.addEventListener("click", function (ev) {
        var b = ev.target.closest("[data-play]");
        if (b) { playAudio("assets/audio/" + b.getAttribute("data-play") + ".mp3", b); }
      });

      /* ============ 今日の練習 ============ */
      var session = null; /* {queue:[ids], idx, retried:{}} */
      function buildSession() {
        var t = todayStr();
        var due = [], fresh = [];
        PHRASES.forEach(function (p) {
          var r = store.prog[p.id];
          if (!r) fresh.push(p.id);
          else if (r.due <= t) due.push(p.id);
        });
        var queue = due.concat(fresh.slice(0, 5));
        return { queue: queue, idx: 0, retried: {}, total: queue.length, reviews: due.length, news: Math.min(fresh.length, 5) };
      }
      function renderToday() {
        var el = document.getElementById("view-today");
        if (!session) session = buildSession();
        if (session.maxIdx == null) session.maxIdx = session.idx;
        if (session.idx >= session.queue.length) {
          var msg = session.total === 0
            ? "今日の復習はありません。新しいフレーズも出し尽くしました。"
            : "今日の練習はおしまいです。おつかれさまでした。";
          var seenIds = [];
          session.queue.forEach(function (q) { if (seenIds.indexOf(q) < 0) seenIds.push(q); });
          var doneList = session.total === 0 ? "" : '<h2 class="scene-title">今日のフレーズ（見返し用）</h2>' + seenIds.map(function (q) {
            var p = BY_ID[q];
            return '<div class="phrase-row"><div class="kana">' + (p.sKana || p.kana) + statusChip(p) + '</div>' +
              '<div class="thai-text thai">' + (p.sTh || p.th) + '</div><p class="meaning">' + p.ja + '</p>' +
              sPartsHTML(p) + playButtonsS(p) + politeLineHTML(p) + '</div>';
          }).join("");
          el.innerHTML = '<div class="card done-box"><div class="face">よくできました</div><p>' + msg + '</p>' +
            '<p>言えるようになったフレーズ: ' + learnedCount() + ' / 64</p>' +
            '<button type="button" class="btn primary" id="moreBtn" style="width:100%;">場面から自由に練習する</button>' +
            (session.total > 0 ? '<button type="button" class="btn slow" id="reviewBtn" style="width:100%;margin-top:8px;">今日のフレーズを見返す</button>' : '') + '</div>' + doneList;
          var mb = document.getElementById("moreBtn");
          if (mb) mb.addEventListener("click", function () { switchView("scenes"); });
          var rb = document.getElementById("reviewBtn");
          if (rb) rb.addEventListener("click", function () { session.idx = 0; renderToday(); });
          return;
        }
        var id = session.queue[session.idx];
        var p = BY_ID[id];
        var isNew = !store.prog[id];
        var dots = session.queue.map(function (q, i) {
          return '<span class="' + (i < session.idx ? "done" : (i === session.idx ? "now" : "")) + '"></span>';
        }).join("");
        var viewingPast = session.idx < session.maxIdx;
        var judgeArea = viewingPast
          ? '<p class="meaning" style="margin-top:10px;">確認用の表示です。音声は何度でも聞けます。判定は最新のフレーズに戻ってからどうぞ。</p>'
          : '<div class="judge-row">' +
            '<button type="button" class="btn again" id="judgeAgain">まだ言えない</button>' +
            '<button type="button" class="btn good" id="judgeGood">言えた！</button>' +
            '</div>' +
            '<p class="meaning" style="margin-top:10px;">音声を聞いて声に出してから、正直に押してください。「言えた」が続くと、次に会う間隔が少しずつ空いていきます。</p>';
        var navRow = '<div class="row-btns" style="margin-top:10px;">' +
          (session.idx > 0 ? '<button type="button" class="btn slow" id="navPrev">← 前のフレーズ</button>' : '') +
          (viewingPast ? '<button type="button" class="btn slow" id="navNext">次のフレーズ →</button>' : '') +
          '</div>';
        el.innerHTML =
          '<div class="session-cap">今日の練習 ' + (session.idx + 1) + ' / ' + session.total +
          '（復習 ' + session.reviews + ' 件・新しいフレーズ ' + session.news + ' 件）</div>' +
          '<div class="dots">' + dots + '</div>' +
          '<div class="card">' + phraseCardHTML(p, isNew ? "新規" : "復習") +
          judgeArea + navRow +
          '</div>';
        if (!viewingPast) {
          document.getElementById("judgeGood").addEventListener("click", function () { judge(id, true); });
          document.getElementById("judgeAgain").addEventListener("click", function () { judge(id, false); });
        }
        var np = document.getElementById("navPrev");
        if (np) np.addEventListener("click", function () { stopAudio(); session.idx--; renderToday(); });
        var nn = document.getElementById("navNext");
        if (nn) nn.addEventListener("click", function () { stopAudio(); session.idx++; renderToday(); });
      }
      function judge(id, good) {
        stopAudio();
        var t = todayStr();
        var r = store.prog[id] || { box: 0, due: t };
        if (good) {
          r.box = Math.min(r.box + 1, INTERVALS.length - 1);
          r.due = addDays(t, INTERVALS[r.box]);
          if (r.box >= 2) toast("覚えてきました。この調子です");
        } else {
          r.box = 0;
          r.due = addDays(t, 1);
          if (!session.retried[id]) { session.retried[id] = true; session.queue.push(id); session.total++; }
          toast("大丈夫。明日もう一度出てきます");
        }
        store.prog[id] = r; store.lastDay = t; save();
        session.idx++;
        if (session.maxIdx == null || session.idx > session.maxIdx) session.maxIdx = session.idx;
        updateProgress();
        renderToday();
      }
      function updateProgress() {
        var n = learnedCount();
        document.getElementById("learnedCount").textContent = n;
        document.getElementById("progressFill").style.width = (n / 64 * 100) + "%";
        var t = todayStr(), dueCount = 0;
        PHRASES.forEach(function (p) { var r = store.prog[p.id]; if (r && r.due <= t) dueCount++; });
        document.getElementById("progressCap").textContent = dueCount > 0
          ? "復習まちのフレーズが " + dueCount + " 件あります"
          : "今日の復習は片付いています";
      }

      /* ============ 場面から探す ============ */
      function renderScenes() {
        var el = document.getElementById("view-scenes");
        var learnedN = PHRASES.filter(function (p) { var r = store.prog[p.id]; return r && r.box >= 2; }).length;
        var studyingN = PHRASES.filter(function (p) { var r = store.prog[p.id]; return r && r.box < 2; }).length;
        var html = '<p class="small" style="margin:4px 0 6px;">状態の見方：✅ 言える ' + learnedN + '件 ・ 📖 練習中 ' + studyingN + '件 ・ ⬜ まだ ' + (64 - learnedN - studyingN) + '件<br>どのフレーズも、ここでいつでも音声つきで見返せます。</p>';
        SCENES.forEach(function (name, si) {
          var list = PHRASES.filter(function (p) { return p.scene === si; });
          var done = list.filter(function (p) { var r = store.prog[p.id]; return r && r.box >= 2; }).length;
          html += '<h2 class="scene-title">' + name + '<span class="cnt">言える ' + done + ' / ' + list.length + '</span></h2>';
          list.forEach(function (p) {
            html += '<div class="phrase-row">' +
              '<div class="kana">' + (p.sKana || p.kana) + statusChip(p) + '</div>' +
              '<div class="thai-text thai">' + (p.sTh || p.th) + '</div>' +
              '<p class="meaning">' + p.ja + '</p>' +
              sPartsHTML(p) +
              playButtonsS(p) +
              politeLineHTML(p) + '</div>';
          });
        });
        el.innerHTML = html;
      }

      /* ============ 聞き取りクイズ ============ */
      var quiz = null;
      function shuffle(a) {
        var x = a.slice();
        for (var i = x.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = x[i]; x[i] = x[j]; x[j] = t; }
        return x;
      }
      function quizPool() {
        var t = todayStr();
        var due = [], learned = [];
        PHRASES.forEach(function (p) {
          var r = store.prog[p.id];
          if (!r) return;
          if (r.due <= t) due.push(p.id); else learned.push(p.id);
        });
        return shuffle(due).concat(shuffle(learned));
      }
      function startQuiz() {
        var ids = quizPool().slice(0, 10);
        quiz = { ids: ids, idx: 0, score: 0, answered: false };
        renderQuiz();
      }
      function renderQuiz() {
        var el = document.getElementById("view-quiz");
        if (!quiz) {
          var poolN = quizPool().length;
          if (poolN === 0) {
            el.innerHTML = '<div class="card done-box"><div class="face">聞き取りクイズ</div>' +
              '<p>聞き取りは、練習したフレーズから出題されます。まず「今日の練習」でフレーズを練習してから来てください。</p>' +
              '<button type="button" class="btn primary" id="quizToToday" style="width:100%;">今日の練習へ</button></div>';
            document.getElementById("quizToToday").addEventListener("click", function () { switchView("today"); });
            return;
          }
          el.innerHTML = '<div class="card done-box"><div class="face">聞き取りクイズ</div>' +
            '<p>タイ語の音声だけを聞いて、意味を当てるクイズです。練習したフレーズから' + Math.min(10, poolN) + '問出題されます（復習どきのフレーズを優先）。</p>' +
            '<button type="button" class="btn primary" id="quizStart" style="width:100%;">クイズをはじめる</button></div>';
          document.getElementById("quizStart").addEventListener("click", startQuiz);
          return;
        }
        if (quiz.idx >= quiz.ids.length) {
          var ratio = quiz.ids.length ? quiz.score / quiz.ids.length : 0;
          el.innerHTML = '<div class="card done-box"><div class="face">' + quiz.score + ' / ' + quiz.ids.length + ' 正解</div>' +
            '<p>' + (ratio >= 0.8 ? "耳が育ってきています。その調子です。" : ratio >= 0.5 ? "半分を超えました。聞き取りは回数です。" : "まだ始めたばかり。ゆっくり音声で復習してから再挑戦を。") + '</p>' +
            '<button type="button" class="btn primary" id="quizStart" style="width:100%;">もう一度挑戦する</button></div>';
          document.getElementById("quizStart").addEventListener("click", startQuiz);
          return;
        }
        var p = BY_ID[quiz.ids[quiz.idx]];
        var others = shuffle(PHRASES.filter(function (q) { return q.id !== p.id; })).slice(0, 3);
        var choices = shuffle([p].concat(others));
        var html = '<div class="card quiz-q"><div class="q-cap">第 ' + (quiz.idx + 1) + ' 問 / ' + quiz.ids.length + '　—　音声を聞いて、意味を選んでください</div>' +
          '<button type="button" class="btn primary quiz-play" data-play="' + (p.id + '-s') + '">' + ICON_PLAY + '<span>再生</span></button>' +
          '<div style="margin-top:10px;"><button type="button" class="btn" data-play="' + p.id + '-s-slow">' + ICON_PLAY + 'ゆっくり聞く</button></div>' +
          '<div class="quiz-feedback" id="quizFb"></div></div>' +
          '<div class="choices">' +

      function talkUserTotal(d) { return d.turns.filter(function (t) { return t.w === "u"; }).length; }
      function normTh(s) { return (s || "").replace(/[\s.,!?…"'、。，．！？：:;・「」『』（）()\-]/g, ""); }
      function stripPolite(s) { return s.replace(/(ครับผม|ครับ|ค่ะ|คะ|นะ)+$/, ""); }
      function levDist(a, b) {
        var m = a.length, n = b.length, i, j;
        if (!m) return n; if (!n) return m;
        var prev = [], cur = [];
        for (j = 0; j <= n; j++) prev[j] = j;
        for (i = 1; i <= m; i++) {
          cur[0] = i;
          for (j = 1; j <= n; j++) {
            cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
          }
          var tmp = prev; prev = cur; cur = tmp;
        }
        return prev[n];

        if (!a || !b) return 0;
        return 1 - levDist(a, b) / Math.max(a.length, b.length);

        var h = normTh(heard), t = normTh(target);

      }

      function stopFreeRec() {
        if (freeRecTimer) { clearTimeout(freeRecTimer); freeRecTimer = null; }
        if (freeRec) { try { freeRec.stop(); } catch (e) { try { freeRec.abort(); } catch (e2) {} } freeRec = null; }
        var mb = document.getElementById("freeMicBtn");
        if (mb) { mb.classList.remove("listening"); mb.textContent = "🎤 タップして話す"; }
      }
      function freeHeard(text) {
        stopFreeRec();
        if (!freeChat) return;
        if (!/[\u0E00-\u0E7F]/.test(text || "")) {
          var st = document.getElementById("freeStatus");
          if (st) st.innerHTML = '<p class="judge-ng">タイ語として聞き取れませんでした</p><p class="small">もう一度、ゆっくりはっきり話してみてください。下の「言い方のヒント」の音声を真似するのもおすすめです。</p>';
          return;
        }
        freeChat.turns.push({ w: "u", th: text });
        freeChat.count++;
        renderFree();
        var st2 = document.getElementById("freeStatus");
        if (st2) st2.innerHTML = '<p class="small">マークが考えています…</p>';
        setTimeout(function () {
          if (!freeChat) return;
          var rep = partnerThink(text);
          rep.lines.forEach(function (ln) { freeChat.turns.push(ln); });
          if (rep.hints && rep.hints.length) freeChat.hints = rep.hints;
          renderFree();
          speakTh(rep.lines.map(function (ln) { return ln.th; }).join(" "), rep.slow ? 0.6 : null);
        }, 900);
      }
      function startFreeRec(isRetry) {
        if (freeRec) { stopFreeRec(); return; }
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        var st = document.getElementById("freeStatus");
        if (!SR) {
          if (st) st.innerHTML = '<p class="small">このブラウザでは音声認識が使えません。iPhoneはSafari、AndroidはChromeで開いてください。</p>';
          return;
        }
        var mb = document.getElementById("freeMicBtn");
        var rec = new SR();
        freeRec = rec;
        rec.lang = "th-TH";
        rec.interimResults = true;
        rec.maxAlternatives = 3;
        if (mb) { mb.classList.add("listening"); mb.textContent = "🎙 聞き取り中…話してください"; }
        if (st) st.innerHTML = '<p class="small">聞き取り中…話し終わるまで待ってください</p>';
        var done = false, bestTxt = "", stableTimer = null, gotEvent = false;
        function armWatch() {
          if (freeRecTimer) clearTimeout(freeRecTimer);
          freeRecTimer = setTimeout(function () {
            if (freeRec === rec) {
              stopFreeRec();
              var s3 = document.getElementById("freeStatus");
              if (s3) s3.innerHTML = '<p class="judge-ng">聞き取りが終わりませんでした</p><p class="small">声が届いていないか、音声認識が止まっています。もう一度マイクを押して、スマホの近くではっきり話してください。</p>';
            }
          }, 12000);
        }
        function finish() {
          if (done || !bestTxt || freeRec !== rec) return;
          done = true;
          if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
          freeHeard(bestTxt);
        }
        rec.onstart = function () { gotEvent = true; armWatch(); };
        rec.onspeechstart = function () { gotEvent = true; armWatch(); };
        rec.onresult = function (ev) {
          gotEvent = true;
          armWatch();
          var interim = "";
          for (var ri = ev.resultIndex; ri < ev.results.length; ri++) {
            var rr = ev.results[ri];
            var tr0 = rr[0].transcript || "";
            if (tr0) bestTxt = tr0;
            if (rr.isFinal) { finish(); return; }
            interim += tr0;
          }
          var s4 = document.getElementById("freeStatus");
          if (s4 && interim) s4.innerHTML = '<div class="heard-box">聞き取り中：' + interim + '</div>';
          if (bestTxt) {
            if (stableTimer) clearTimeout(stableTimer);
            stableTimer = setTimeout(finish, 2500);
          }
        };
        rec.onerror = function (ev) {
          stopFreeRec();
          var s5 = document.getElementById("freeStatus");
          if (!s5) return;
          if (ev.error === "not-allowed") s5.innerHTML = '<p class="judge-ng">マイクが許可されていません</p><p class="small">ブラウザの設定でマイクを許可してから、もう一度マイクを押してください。</p>';
          else if (ev.error === "no-speech") s5.innerHTML = '<p class="judge-ng">声が聞き取れませんでした</p><p class="small">もう一度、マイクの近くではっきり話してみてください。</p>';
          else s5.innerHTML = '<p class="judge-ng">聞き取りに失敗しました（' + ev.error + '）</p><p class="small">もう一度マイクを押して試してください。</p>';
        };
        rec.onend = function () {
          if (freeRec !== rec) return;
          if (!done && bestTxt) { finish(); return; }
          if (freeRecTimer) { clearTimeout(freeRecTimer); freeRecTimer = null; }
          if (stableTimer) { clearTimeout(stableTimer); stableTimer = null; }
          freeRec = null;
          var m2 = document.getElementById("freeMicBtn");
          if (m2) { m2.classList.remove("listening"); m2.textContent = "🎤 タップして話す"; }
          if (!done && !bestTxt) {
            var s6 = document.getElementById("freeStatus");
            if (s6) s6.innerHTML = '<p class="judge-ng">声が聞き取れませんでした</p><p class="small">マイクを押してから少し待って、スマホの近くではっきり話してください。もう一度どうぞ。</p>';
          }
        };
        armWatch();
        if (!isRetry) {
          setTimeout(function () {
            if (!gotEvent && freeRec === rec) { stopFreeRec(); startFreeRec(true); }
          }, 3500);
        }
        try { rec.start(); } catch (e) { stopFreeRec(); }
      }

      /* ============ 画面切り替え ============ */
      function switchView(name) {
        stopAudio();
        stopRec();
        stopFreeRec();
        document.querySelectorAll("nav.tabs button").forEach(function (b) {
          b.setAttribute("aria-selected", b.getAttribute("data-view") === name ? "true" : "false");
        });
        document.querySelectorAll("section.view").forEach(function (s) { s.classList.remove("active"); });
        document.getElementById("view-" + name).classList.add("active");
        if (name === "today") renderToday();
        if (name === "scenes") renderScenes();
        if (name === "quiz") renderQuiz();
        if (name === "talk") renderTalk();
        if (name === "free") renderFree();
        if (name === "listen") renderListen();
        if (name === "grammar") renderGrammar();
        if (name === "tones") renderTones();
        window.scrollTo({ top: 0 });
      }
      document.querySelectorAll("nav.tabs button").forEach(function (b) {
        b.addEventListener("click", function () { switchView(b.getAttribute("data-view")); });
      });
      document.getElementById("resetBtn").addEventListener("click", function () {
        if (document.getElementById("resetBtn").dataset.armed) {
          store = { prog: {}, lastDay: "" }; save(); session = null; quiz = null;
          updateProgress(); renderToday();
          document.getElementById("resetBtn").textContent = "記録をすべて消す";
          delete document.getElementById("resetBtn").dataset.armed;
          toast("記録を消しました");
        } else {
          document.getElementById("resetBtn").dataset.armed = "1";
          document.getElementById("resetBtn").textContent = "本当に消しますか？（もう一度押すと消えます）";
          setTimeout(function () {
            var b = document.getElementById("resetBtn");
            delete b.dataset.armed; b.textContent = "記録をすべて消す";
          }, 4000);
        }
      });

      updateProgress();
      renderToday();
    </script>
  </body>
</html>
